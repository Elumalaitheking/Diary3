<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8fb9a8" />
    <title>Calm Diary</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <h1>Calm Diary</h1>
      <small id="todayLabel"></small>
    </header>

    <main id="appMain">
      <section id="home" class="view active">
        <h2>Recent Entries</h2>
        <div id="entryList" class="card-list"></div>
      </section>

      <section id="entry" class="view">
        <h2>Add Diary Entry</h2>
        <form id="entryForm" class="panel">
          <label>Date
            <input type="date" id="entryDate" required />
          </label>
          <label>Title / Event
            <input type="text" id="entryTitle" placeholder="What happened today?" required />
          </label>
          <div class="toolbar" role="toolbar" aria-label="Formatting toolbar">
            <button type="button" data-cmd="bold"><b>B</b></button>
            <button type="button" data-cmd="italic"><i>I</i></button>
            <button type="button" data-cmd="underline"><u>U</u></button>
          </div>
          <label>Diary Content</label>
          <div id="entryContent" class="editor" contenteditable="true" aria-label="Diary content"></div>
          <small>Auto-correction may be available via your mobile keyboard and browser spellcheck.</small>
          <label>Photos
            <input type="file" id="entryPhotos" accept="image/*" capture="environment" multiple />
          </label>
          <div id="photoPreview" class="photo-grid"></div>
          <button type="submit" class="primary">Save Entry</button>
          <small id="autosaveStatus"></small>
        </form>
      </section>

      <section id="search" class="view">
        <h2>Search</h2>
        <div class="panel">
          <input type="search" id="searchKeyword" placeholder="Keyword or event name" />
          <div class="row">
            <label>From<input type="date" id="searchFrom" /></label>
            <label>To<input type="date" id="searchTo" /></label>
          </div>
          <div class="row">
            <label>Month
              <select id="searchMonth">
                <option value="">Any</option>
              </select>
            </label>
            <label>Year
              <select id="searchYear">
                <option value="">Any</option>
              </select>
            </label>
          </div>
          <button id="runSearch" class="primary">Search Entries</button>
        </div>
        <div id="searchResults" class="card-list"></div>
      </section>

      <section id="notes" class="view">
        <h2>Notes</h2>
        <div class="panel">
          <input id="noteTitle" placeholder="Note title" />
          <textarea id="noteText" rows="4" placeholder="Quick thought, learning point, or idea..."></textarea>
          <input id="noteTags" placeholder="Tags (comma separated)" />
          <button id="saveNote" class="primary">Save Note</button>
          <input type="search" id="noteSearch" placeholder="Search notes" />
        </div>
        <div id="noteList" class="card-list"></div>
      </section>

      <section id="reminders" class="view">
        <h2>Reminders</h2>
        <div class="panel">
          <input id="reminderTitle" placeholder="Reminder title" />
          <textarea id="reminderDesc" rows="3" placeholder="Event, task, or learning goal"></textarea>
          <input type="datetime-local" id="reminderTime" />
          <button id="saveReminder" class="primary">Add Reminder</button>
          <button id="notifyPermission">Enable Notifications</button>
        </div>
        <div id="calendarView" class="calendar"></div>
        <div id="reminderList" class="card-list"></div>
      </section>

      <section id="settings" class="view">
        <h2>Settings</h2>
        <div class="panel">
          <label class="switch">Dark mode <input type="checkbox" id="darkModeToggle" /></label>
          <button id="exportJson">Export JSON</button>
          <button id="exportText">Export Text</button>
          <button id="exportPdf">Export via Print/PDF</button>
          <label class="restore">Restore from Backup JSON
            <input type="file" id="restoreFile" accept="application/json" />
          </label>
          <button id="clearData" class="danger">Clear All Data</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-view="home" class="active">Home</button>
      <button data-view="entry">Add Entry</button>
      <button data-view="search">Search</button>
      <button data-view="notes">Notes</button>
      <button data-view="reminders">Reminders</button>
      <button data-view="settings">Settings</button>
    </nav>

    <template id="cardTemplate">
      <article class="card"></article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
